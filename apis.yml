name: Civitas Learning
description: >-
  Civitas Learning is a higher education technology company whose Student Impact
  Platform unifies student data, predictive analytics, and coordinated workflows
  to help colleges and universities improve enrollment, persistence, and
  completion outcomes. The platform consolidates data from SIS, LMS, CRM, and
  event systems into a data lakehouse, layers institution-specific predictive
  models (CivIQ) on top, and surfaces real-time, actionable insights to advisors,
  faculty, and administrators through products such as Explore, Inspire, Impact,
  Illume, College Scheduler, Degree Map, and Academic Planning. Civitas Learning
  serves institutions of all sizes and pairs its software with strategic advisory
  services. It does not publish a public developer API; this profile captures its
  public operational, security, and compliance surface.
